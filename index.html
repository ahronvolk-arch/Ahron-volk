<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>קניות לבית</title>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #f4f6fa;
      --card: #ffffff;
      --primary: #4361ee;
      --primary-light: #eef2ff;
      --text: #1e293b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* מסך התחברות / הרשמה */
    .auth-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 9999;
    }

    .auth-card {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
    }

    .auth-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .auth-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-bottom: 12px;
      line-height: 1.3;
      min-height: 18px;
    }

    .auth-field {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
      direction: ltr;
      text-align: right;
    }

    .auth-field:focus {
      border-color: var(--primary);
    }

    .btn-auth-main {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 4px 14px rgba(67, 97, 238, 0.3);
    }

    .auth-link {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--primary);
      cursor: pointer;
      text-decoration: underline;
    }

    /* שלד ראשי של האפליקציה */
    .app-wrapper {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
    }

    .header-text h1 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .header-user {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
      direction: ltr;
      text-align: right;
    }

    .btn-logout {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* לשוניות */
    .tabs-wrapper {
      padding: 0 20px;
      margin-bottom: 16px;
    }

    .tabs-box {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    /* טופס הוספה */
    .input-wrapper {
      padding: 0 20px;
      margin-bottom: 20px;
    }

    .input-box {
      background: var(--card);
      padding: 10px 14px;
      border-radius: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .text-input {
      flex: 2;
      border: none;
      outline: none;
      font-size: 1rem;
      color: var(--text);
    }

    .select-category {
      flex: 1.2;
      border: 1px solid #edf2f7;
      background: #f8fafc;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-plus {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      border: none;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* תוכן מוצרים */
    .list-wrapper {
      flex: 1;
      padding: 0 20px 40px;
    }

    .group-block {
      margin-bottom: 18px;
    }

    .group-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding-right: 4px;
    }

    .item-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    .item-card.checked {
      opacity: 0.55;
      background: rgba(255, 255, 255, 0.6);
    }

    .item-card.checked .name-label {
      text-decoration: line-through;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .check-box {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .name-label {
      font-size: 1rem;
      font-weight: 500;
    }

    .item-left {
      display: flex;
      gap: 8px;
    }

    .action-icon {
      background: none;
      border: none;
      font-size: 1.1rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    .hidden {
      display: none !important;
    }

    .empty-note {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- מסך התחברות והרשמה -->
  <div id="authScreen" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-icon">🛒</div>
      <div class="auth-title" id="authTitle">התחברות לקניות</div>
      <div class="auth-desc" id="authDesc">הזן אימייל וסיסמה כדי להתחבר לרשימה המשפחתית שלך</div>
      
      <div class="auth-error" id="authError"></div>

      <input type="email" id="emailInput" class="auth-field" placeholder="כתובת אימייל">
      <input type="password" id="passInput" class="auth-field" placeholder="סיסמה (6 תווים ומעלה)">

      <button class="btn-auth-main" id="authSubmitBtn" onclick="submitAuth()">התחבר</button>
      
      <div class="auth-link" id="authToggleBtn" onclick="switchAuthView()">אין לך חשבון עדיין? לחץ כאן להרשמה</div>
    </div>
  </div>

  <!-- האפליקציה הראשית -->
  <div class="app-wrapper">
    <header>
      <div class="header-text">
        <h1>קניות לבית</h1>
        <div class="header-user" id="userBadge">מחובר</div>
      </div>
      <button class="btn-logout" onclick="logout()">התנתק</button>
    </header>

    <div class="tabs-wrapper">
      <div class="tabs-box">
        <button class="tab-btn active" id="tabItems" onclick="changeTab('items')">רשימת קניות</button>
        <button class="tab-btn" id="tabRegular" onclick="changeTab('regular')">⭐ מוצרים קבועים</button>
      </div>
    </div>

    <div class="input-wrapper">
      <div class="input-box">
        <input type="text" id="itemName" class="text-input" placeholder="הוסף מוצר...">
        <select id="itemCat" class="select-category">
          <option value="כללי">כללי</option>
          <option value="ירקות ופירות">ירקות ופירות</option>
          <option value="חלב וביצים">חלב וביצים</option>
          <option value="מאפים ולחם">מאפים ולחם</option>
          <option value="בשר ודגים">בשר ודגים</option>
          <option value="שימורים ויבשים">שימורים ויבשים</option>
          <option value="חטיפים ומתוקים">חטיפים ומתוקים</option>
          <option value="משקאות">משקאות</option>
          <option value="ניקיון ובית">ניקיון ובית</option>
        </select>
        <button class="btn-plus" onclick="createItem()">+</button>
      </div>
    </div>

    <main class="list-wrapper" id="listArea">
      <div class="empty-note">טוען נתונים...</div>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD_gqEqymNTkmhKCb1NATJ2MlJVWoruOoM",
      authDomain: "home-groceries-75b84.firebaseapp.com",
      projectId: "home-groceries-75b84",
      storageBucket: "home-groceries-75b84.appspot.com"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let userObj = null;
    let activeTab = 'items';
    let isRegister = false;
    let stopListening = null;

    // האזנה למצב המשתמש
    auth.onAuthStateChanged(user => {
      userObj = user;
      const overlay = document.getElementById('authScreen');
      if (user) {
        overlay.classList.add('hidden');
        document.getElementById('userBadge').innerText = user.email;
        startListening();
      } else {
        overlay.classList.remove('hidden');
        if (stopListening) stopListening();
        document.getElementById('listArea').innerHTML = '';
      }
    });

    // מעבר בין הרשמה להתחברות
    function switchAuthView() {
      isRegister = !isRegister;
      document.getElementById('authError').innerText = '';
      if (isRegister) {
        document.getElementById('authTitle').innerText = "יצירת חשבון חדש";
        document.getElementById('authDesc').innerText = "הזן אימייל וסיסמה כדי לפתוח רשימה משפחתית נפרדת";
        document.getElementById('authSubmitBtn').innerText = "הירשם עכשיו";
        document.getElementById('authToggleBtn').innerText = "כבר רשום? לחץ כאן להתחברות";
      } else {
        document.getElementById('authTitle').innerText = "התחברות לקניות";
        document.getElementById('authDesc').innerText = "הזן אימייל וסיסמה כדי להתחבר לרשימה המשפחתית שלך";
        document.getElementById('authSubmitBtn').innerText = "התחבר";
        document.getElementById('authToggleBtn').innerText = "אין לך חשבון עדיין? לחץ כאן להרשמה";
      }
    }

    // ביצוע פעולת הרשמה / התחברות
    async function submitAuth() {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passInput').value;
      const errBox = document.getElementById('authError');
      errBox.innerText = '';

      if (!email || !pass) {
        errBox.innerText = "נא להזין אימייל וסיסמה";
        return;
      }

      try {
        if (isRegister) {
          await auth.createUserWithEmailAndPassword(email, pass);
        } else {
          await auth.signInWithEmailAndPassword(email, pass);
        }
      } catch (err) {
        if (err.code === 'auth/configuration-not-found') {
          errBox.innerText = "שירות ההתחברות לא הופעל עדיין במסוף פיירבייס.";
        } else if (err.code === 'auth/email-already-in-use') {
          errBox.innerText = "כתובת אימייל זו כבר תפוסה.";
        } else if (err.code === 'auth/weak-password') {
          errBox.innerText = "סיסמה חייבת להיות לפחות 6 תווים.";
        } else if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          errBox.innerText = "אימייל או סיסמה שגויים.";
        } else {
          errBox.innerText = "שגיאה: " + err.message;
        }
      }
    }

    function logout() {
      auth.signOut();
    }

    function changeTab(tab) {
      activeTab = tab;
      document.getElementById('tabItems').classList.toggle('active', tab === 'items');
      document.getElementById('tabRegular').classList.toggle('active', tab === 'regular');
      startListening();
    }

    function startListening() {
      if (!userObj) return;
      if (stopListening) stopListening();

      const targetCol = activeTab === 'items' ? 'items' : 'regular_items';

      stopListening = db.collection('users')
        .doc(userObj.uid)
        .collection(targetCol)
        .orderBy('timestamp', 'desc')
        .onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push({ id: d.id, ...d.data() }));
          render(list);
        }, err => console.error(err));
    }

    function render(items) {
      const container = document.getElementById('listArea');
      if (items.length === 0) {
        container.innerHTML = `<div class="empty-note">אין מוצרים ברשימה זו כרגע</div>`;
        return;
      }

      const groups = {};
      items.forEach(i => {
        const cat = i.category || 'כללי';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(i);
      });

      let out = '';
      for (const [catName, catItems] of Object.entries(groups)) {
        out += `
          <div class="group-block">
            <div class="group-name">${catName}</div>
            ${catItems.map(item => `
              <div class="item-card ${item.completed ? 'checked' : ''}">
                <div class="item-right">
                  <input type="checkbox" class="check-box" 
                    ${item.completed ? 'checked' : ''} 
                    onchange="toggleDone('${item.id}',${!item.completed})">
                  <span class="name-label">${item.name}</span>
                </div>
                <div class="item-left">
                  ${activeTab === 'regular' ? `
                    <button class="action-icon" title="העבר לקניות" onclick="moveToCart('${item.name}', '${item.category}')">🛒</button>
                  ` : ''}
                  <button class="action-icon" title="מחק" onclick="remove('${item.id}')">🗑️</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      container.innerHTML = out;
    }

    async function createItem() {
      const input = document.getElementById('itemName');
      const cat = document.getElementById('itemCat').value;
      const text = input.value.trim();

      if (!text || !userObj) return;

      const targetCol = activeTab === 'items' ? 'items' : 'regular_items';

      try {
        await db.collection('users')
          .doc(userObj.uid)
          .collection(targetCol)
          .add({
            name: text,
            category: cat,
            completed: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });

        input.value = '';
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('itemName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') createItem();
    });

    async function toggleDone(id, val) {
      if (!userObj) return;
      const targetCol = activeTab === 'items' ? 'items' : 'regular_items';
      await db.collection('users').doc(userObj.uid).collection(targetCol).doc(id).update({ completed: val });
    }

    async function remove(id) {
      if (!userObj) return;
      const targetCol = activeTab === 'items' ? 'items' : 'regular_items';
      await db.collection('users').doc(userObj.uid).collection(targetCol).doc(id).delete();
    }

    async function moveToCart(name, category) {
      if (!userObj) return;
      await db.collection('users').doc(userObj.uid).collection('items').add({
        name: name,
        category: category,
        completed: false,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      alert(`"${name}" נוסף בהצלחה לרשימת הקניות!`);
    }
  </script>
</body>
</html>
