<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>קניות משפחת וולק</title>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #4361ee;
      --primary-light: #eef2ff;
      --text: #2b2d42;
      --text-light: #8d99ae;
      --danger: #ef233c;
      --border-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* מסך התחברות והרשמה */
    .auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 1000;
    }

    .auth-card {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      text-align: center;
    }

    .auth-logo {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .auth-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 24px;
    }

    .auth-input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-input:focus {
      border-color: var(--primary);
    }

    .btn-auth-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
    }

    .auth-toggle-link {
      margin-top: 18px;
      font-size: 0.9rem;
      color: var(--primary);
      cursor: pointer;
      text-decoration: underline;
    }

    .auth-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* כותרת עליונה של האפליקציה המקורית */
    header {
      padding: 24px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title-area h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    .user-email-tag {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 2px;
      display: block;
    }

    .btn-logout {
      background: white;
      border: 1px solid #e2e8f0;
      color: var(--text-light);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* לשוניות הניווט המקוריות */
    .tabs-bar {
      display: flex;
      margin: 8px 20px 16px;
      background: #e2e8f0;
      border-radius: 14px;
      padding: 4px;
    }

    .tab-item {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-light);
      border-radius: 10px;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.2s;
    }

    .tab-item.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.06);
    }

    /* טופס הוספת מוצר */
    .add-section {
      padding: 0 20px;
      margin-bottom: 20px;
    }

    .add-box {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      align-items: center;
    }

    .item-input {
      flex: 2;
      border: none;
      font-size: 1rem;
      outline: none;
      color: var(--text);
    }

    .category-select {
      flex: 1.2;
      border: 1px solid #edf2f7;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.85rem;
      outline: none;
      background-color: #f8fafc;
      color: var(--text);
    }

    .btn-add-action {
      background: var(--primary);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* תוכן ורשימת מוצרים */
    .content-box {
      flex: 1;
      padding: 0 20px 40px;
    }

    .category-block {
      margin-bottom: 20px;
    }

    .category-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 10px;
      padding-right: 4px;
    }

    .item-row {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    }

    .item-row.completed {
      background: rgba(255, 255, 255, 0.6);
      opacity: 0.55;
    }

    .item-row.completed .item-title {
      text-decoration: line-through;
    }

    .item-left-side {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .custom-check {
      width: 22px;
      height: 22px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .item-title {
      font-size: 1rem;
      font-weight: 500;
    }

    .actions-side {
      display: flex;
      gap: 6px;
    }

    .icon-action-btn {
      background: none;
      border: none;
      padding: 6px;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-light);
      border-radius: 8px;
    }

    .empty-message {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- מסך התחברות / הרשמה מאובטח -->
  <div id="authScreen" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-logo">🛒</div>
      <div class="auth-title" id="authTitleText">התחברות לקניות</div>
      <div class="auth-subtitle" id="authSubtitleText">הזן אימייל וסיסמה כדי להתחבר לרשימה שלך</div>
      
      <div class="auth-error" id="authErrorMessage"></div>

      <input type="email" id="authEmail" class="auth-input" placeholder="אימייל">
      <input type="password" id="authPassword" class="auth-input" placeholder="סיסמה (לפחות 6 תווים)">

      <button class="btn-auth-primary" id="btnAuthSubmit" onclick="handleAuthAction()">התחבר</button>
      
      <div class="auth-toggle-link" id="authToggleLink" onclick="toggleAuthMode()">אין לך חשבון עדיין? לחץ כאן להרשמה</div>
    </div>
  </div>

  <!-- האפליקציה הראשית -->
  <div class="app-container">
    <header>
      <div class="app-title-area">
        <h1>קניות לבית</h1>
        <span class="user-email-tag" id="userEmailDisplay">מחובר</span>
      </div>
      <button class="btn-logout" onclick="logoutUser()">התנתק</button>
    </header>

    <!-- מעבר בין רשימה שוטפת למוצרים קבועים -->
    <div class="tabs-bar">
      <button class="tab-item active" id="tabItemsBtn" onclick="switchActiveTab('items')">רשימת קניות</button>
      <button class="tab-item" id="tabRegularBtn" onclick="switchActiveTab('regular')">⭐ מוצרים קבועים</button>
    </div>

    <!-- שורת הוספת מוצר -->
    <div class="add-section">
      <div class="add-box">
        <input type="text" id="newProductName" class="item-input" placeholder="הוסף מוצר...">
        <select id="newProductCategory" class="category-select">
          <option value="כללי">כללי</option>
          <option value="ירקות ופירות">ירקות ופירות</option>
          <option value="חלב וביצים">חלב וביצים</option>
          <option value="מאפים ולחם">מאפים ולחם</option>
          <option value="בשר ודגים">בשר ודגים</option>
          <option value="שימורים ויבשים">שימורים ויבשים</option>
          <option value="חטיפים ומתוקים">חטיפים ומתוקים</option>
          <option value="משקאות">משקאות</option>
          <option value="ניקיון ובית">ניקיון ובית</option>
        </select>
        <button class="btn-add-action" onclick="addItem()">+</button>
      </div>
    </div>

    <!-- אזור המוצרים -->
    <main class="content-box" id="listContent">
      <div class="empty-message">טוען נתונים...</div>
    </main>
  </div>

  <script>
    // 1. הגדרות Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD_gqEqymNTkmhKCb1NATJ2MlJVWoruOoM",
      authDomain: "home-groceries-75b84.firebaseapp.com",
      projectId: "home-groceries-75b84",
      storageBucket: "home-groceries-75b84.appspot.com"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentTab = 'items'; // 'items' או 'regular'
    let isRegisterMode = false;
    let unsubscribeSnapshot = null;

    // 2. בדיקת מצב חיבור משתמש (נשאר מחובר גם אחרי סגירת הדפדפן)
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const authScreen = document.getElementById('authScreen');
      if (user) {
        authScreen.classList.add('hidden');
        document.getElementById('userEmailDisplay').innerText = user.email;
        loadUserItems();
      } else {
        authScreen.classList.remove('hidden');
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        document.getElementById('listContent').innerHTML = '';
      }
    });

    // 3. החלפה בין מסך התחברות למסך הרשמה
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('authTitleText');
      const subtitle = document.getElementById('authSubtitleText');
      const submitBtn = document.getElementById('btnAuthSubmit');
      const toggleLink = document.getElementById('authToggleLink');
      const errorDiv = document.getElementById('authErrorMessage');
      errorDiv.innerText = '';

      if (isRegisterMode) {
        title.innerText = "יצירת חשבון חדש";
        subtitle.innerText = "הזן אימייל וסיסמה כדי לפתוח רשימה משפחתית נפרדת";
        submitBtn.innerText = "הירשם עכשיו";
        toggleLink.innerText = "כבר רשום? לחץ כאן להתחברות";
      } else {
        title.innerText = "התחברות לקניות";
        subtitle.innerText = "הזן אימייל וסיסמה כדי להתחבר לרשימה שלך";
        submitBtn.innerText = "התחבר";
        toggleLink.innerText = "אין לך חשבון עדיין? לחץ כאן להרשמה";
      }
    }

    // 4. ביצוע התחברות / הרשמה
    async function handleAuthAction() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errorDiv = document.getElementById('authErrorMessage');
      errorDiv.innerText = '';

      if (!email || !password) {
        errorDiv.innerText = "נא למלא אימייל וסיסמה";
        return;
      }

      try {
        if (isRegisterMode) {
          await auth.createUserWithEmailAndPassword(email, password);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          errorDiv.innerText = "אימייל או סיסמה לא נכונים";
        } else if (err.code === 'auth/email-already-in-use') {
          errorDiv.innerText = "כתובת אימייל זו כבר קיימת במערכת";
        } else if (err.code === 'auth/weak-password') {
          errorDiv.innerText = "הסיסמה צריכה להכיל לפחות 6 תווים";
        } else {
          errorDiv.innerText = "שגיאה בחיבור: " + err.message;
        }
      }
    }

    // 5. התנתקות
    function logoutUser() {
      auth.signOut();
    }

    // 6. מעבר בין לשוניות (קניות / קבועים)
    function switchActiveTab(tabName) {
      currentTab = tabName;
      document.getElementById('tabItemsBtn').classList.toggle('active', tabName === 'items');
      document.getElementById('tabRegularBtn').classList.toggle('active', tabName === 'regular');
      loadUserItems();
    }

    // 7. טעינת נתונים בזמן אמת מתוך התיקייה הפרטית של המשתמש בלבד
    function loadUserItems() {
      if (!currentUser) return;
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const subCollection = currentTab === 'items' ? 'items' : 'regular_items';

      // כל משתמש קורא רק מה-UID שלו - אף אחד אחר לא רואה כלום!
      unsubscribeSnapshot = db.collection('users')
        .doc(currentUser.uid)
        .collection(subCollection)
        .orderBy('timestamp', 'desc')
        .onSnapshot(snapshot => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          renderItemsList(list);
        }, err => {
          console.error("שגיאה בטעינת פריטים:", err);
        });
    }

    // 8. רינדור הפריטים לפי קטגוריות בעיצוב הנקי
    function renderItemsList(items) {
      const container = document.getElementById('listContent');
      if (items.length === 0) {
        container.innerHTML = `<div class="empty-message">אין מוצרים ברשימה זו כרגע</div>`;
        return;
      }

      const grouped = {};
      items.forEach(it => {
        const cat = it.category || 'כללי';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(it);
      });

      let html = '';
      for (const [category, groupItems] of Object.entries(grouped)) {
        html += `
          <div class="category-block">
            <div class="category-title">${category}</div>
            ${groupItems.map(item => `
              <div class="item-row ${item.completed ? 'completed' : ''}">
                <div class="item-left-side">
                  <input type="checkbox" class="custom-check" 
                    ${item.completed ? 'checked' : ''} 
                    onchange="toggleCheck('${item.id}',${!item.completed})">
                  <span class="item-title">${item.name}</span>
                </div>
                <div class="actions-side">
                  ${currentTab === 'regular' ? `
                    <button class="icon-action-btn" title="הוסף לרשימת הקניות" onclick="addFromRegular('${item.name}', '${item.category}')">🛒</button>
                  ` : ''}
                  <button class="icon-action-btn" title="מחיקה" onclick="deleteProduct('${item.id}')">🗑️</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }
      container.innerHTML = html;
    }

    // 9. הוספת מוצר
    async function addItem() {
      const nameInput = document.getElementById('newProductName');
      const catSelect = document.getElementById('newProductCategory');
      const name = nameInput.value.trim();
      const category = catSelect.value;

      if (!name || !currentUser) return;

      const subCollection = currentTab === 'items' ? 'items' : 'regular_items';

      try {
        await db.collection('users')
          .doc(currentUser.uid)
          .collection(subCollection)
          .add({
            name: name,
            category: category,
            completed: false,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });

        nameInput.value = '';
      } catch (e) {
        console.error("שגיאה בהוספה:", e);
      }
    }

    // הוספה ב-Enter
    document.getElementById('newProductName').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addItem();
    });

    // 10. סימון מוצר
    async function toggleCheck(id, status) {
      if (!currentUser) return;
      const subCollection = currentTab === 'items' ? 'items' : 'regular_items';
      await db.collection('users')
        .doc(currentUser.uid)
        .collection(subCollection)
        .doc(id)
        .update({ completed: status });
    }

    // 11. מחיקת מוצר
    async function deleteProduct(id) {
      if (!currentUser) return;
      const subCollection = currentTab === 'items' ? 'items' : 'regular_items';
      await db.collection('users')
        .doc(currentUser.uid)
        .collection(subCollection)
        .doc(id)
        .delete();
    }

    // 12. הוספת מוצר קבוע לרשימת הקניות
    async function addFromRegular(name, category) {
      if (!currentUser) return;
      await db.collection('users')
        .doc(currentUser.uid)
        .collection('items')
        .add({
          name: name,
          category: category,
          completed: false,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      alert(`"${name}" נוסף לרשימת הקניות!`);
    }
  </script>
</body>
</html>
